
services:
  scheduler:
    environment:
      DATABASE_URL: postgresql+psycopg://ocado:ocado-dev@db:5432/orders
    volumes:
      - ../src/ocado_interview:/usr/local/airflow/include/ocado_interview:ro,z
      - ../data:/usr/local/airflow/include/data:z
    networks:
      - airflow
      - ocado

  dag-processor:
    environment:
      DATABASE_URL: postgresql+psycopg://ocado:ocado-dev@db:5432/orders
    volumes:
      - ../src/ocado_interview:/usr/local/airflow/include/ocado_interview:ro,z
      - ../data:/usr/local/airflow/include/data:z
    networks:
      - airflow
      - ocado

  api-server:
    environment:
      DATABASE_URL: postgresql+psycopg://ocado:ocado-dev@db:5432/orders
    volumes:
      - ../src/ocado_interview:/usr/local/airflow/include/ocado_interview:ro,z
      - ../data:/usr/local/airflow/include/data:z
    networks:
      - airflow
      - ocado

  triggerer:
    environment:
      DATABASE_URL: postgresql+psycopg://ocado:ocado-dev@db:5432/orders
    volumes:
      - ../src/ocado_interview:/usr/local/airflow/include/ocado_interview:ro,z
      - ../data:/usr/local/airflow/include/data:z
    networks:
      - airflow
      - ocado

networks:
  ocado:
    external: true
    name: ocado-network
